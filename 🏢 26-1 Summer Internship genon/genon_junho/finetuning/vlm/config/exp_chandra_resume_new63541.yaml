# =============================================================================
# Chandra Table+Layout SFT — 기존 어댑터(chandra_all_e18align_20260623_lora, reference_16886로
# 학습됨)에서 이어서, 신규 큐레이션(Medium+Hard, 20,932건)만 추가 학습.
# - reference_16886은 그 어댑터가 이미 학습한 데이터라 여기서는 안 씀(다시 넣으면 같은
#   데이터를 두 번 학습시켜 과적합 위험 -- 2026-07-20 사용자 확인).
# - 기존 어댑터 설정(r=128/alpha=256/dropout=0.15/target_modules 7개)이 이 config의
#   student_sft.lora_* 값과 정확히 동일 -- resume_from_adapter 사용시 이 값들은 실제로는
#   안 쓰이고(어댑터 자체 설정을 로드) 참고용으로만 남겨둠(distill/student_sft.py 참고).
# - epoch 7 -> 3 으로 축소: 이미 좋은 시작점에서 출발하므로(warm start) 처음부터 학습하는
#   것보다 적은 epoch로도 충분할 가능성이 높고, early_stopping(patience=6)도 걸려있어
#   수렴하면 더 일찍 끝날 수 있음. 시간 단축 목적(전체 7 epoch 기준 33~43시간 -> 이 설정
#   추정 8~10시간, 2026-07-20 추정치라 실측과 다를 수 있음).
# =============================================================================

student:
  name_or_path: "/NHNHOME/WORKSPACE/0426030039_A/jhyeo/ocr_file_filter/_models/Qwen3.5-9B"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

student_sft:
  output_dir: "./output/chandra_resume_new63541_20260720/student_sft"
  resume_from_adapter: "/NHNHOME/WORKSPACE/0426030039_A/jhyeo/ocr_file_filter/_models/chandra_all_e18align_20260623_lora"
  train_file: "../finetuning_dataset/new_63541/train.jsonl"
  eval_file: "../finetuning_dataset/new_63541/valid.jsonl"
  # image_path 가 new_63541 안에서 이미 상대경로(자기 폴더 기준)라 image_dir 불필요
  # (train_qlora.py 의 _resolve_image_path 가 data_parent 기준으로 알아서 찾음).

  # ===== e18 학습 하이퍼파라미터 (epoch 축소 + batch/accum 조정, 나머지 원본 그대로) =====
  # 2026-07-20: per_device_train_batch_size=4/grad_accum=2 조합으로 step 64/813에서
  # CUDA OOM(45.47GiB 요청) 발생 -- auto_expand_max_seq_length 로 큰 표 문서가 배치에
  # 몰리면 순간 메모리 스파이크가 남. batch 4->2, accum 2->4 로 바꿔 effective batch(=64)는
  # 그대로 유지한 채 배치당 최악의 메모리만 절반으로 줄임.
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.5e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.08
  max_seq_length: 8192
  truncate_to_assistant: false
  auto_expand_max_seq_length: true
  max_seq_length_cap: 12288
  long_table_context_margin_tokens: 512
  bf16: true
  tf32: false
  gradient_checkpointing: true
  auto_find_batch_size: false
  optim: "adamw_torch_fused"
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  max_eval_samples: 700

  # 통합 파이프라인 옵션(데이터 형식 유지, 학습 동작만 e18 정렬) ----------------
  task_mix_sampling: false
  span_weighted_sampling: false
  include_thinking: false
  annotate_empty_cells: true
  empty_cell_token: "__EMPTY__"
  single_quote_html_attrs: false
  strip_ocr_score: true

  train_ocr_mix_ratio: 0.5
  train_ocr_mix_seed: 20260320

  max_pixels: 262144
  min_pixels: 65536

  use_lora: true
  quantization:
    load_in_4bit: false
  lora_r: 128
  lora_alpha: 256
  lora_dropout: 0.15
  lora_bias: "none"
  lora_task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  report_to: "wandb"
  run_name: "chandra_resume_new63541_20260720"
  logging_steps: 50
  save_steps: 50
  save_total_limit: null
  eval_steps: 50
  early_stopping:
    enabled: true
    patience: 6
    threshold: 0.0003
    metric: "eval_loss"
    greater_is_better: false
