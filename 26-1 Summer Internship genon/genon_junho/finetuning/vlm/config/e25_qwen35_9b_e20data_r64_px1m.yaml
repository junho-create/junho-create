# =============================================================================
# E25 SFT — Qwen3.5-9B(Instruct) + combined_e25_28791 23,950 (e24_table_refined + 공공 OCR hardcase 1,471)
# - 베이스 config: e24_qwen35_9b_e20data_r64_px1m.yaml — **데이터만 교체**하고 모델/
#   하이퍼파라미터/LoRA/해상도/token_weighting 은 e24 그대로 둔다(변인 1개).
#
# - e24 대비 바뀐 것은 학습/검증 파일 경로뿐이다:
#     combined_e24_refined (train 22,727 / valid 2,629 / test 1,964 = 27,320)
#       -> combined_e25_28791 (train 23,950 / valid 2,771 / test 2,070 = 28,791)
#
# - combined_e25_28791 은 combined_e24_table_refined(e24_refined 의 Table div 를 paddle
#   추론으로 교체한 버전, 27,320건) 에 ocr_filter_result/batch5400/final_gt_1571.jsonl
#   (공공 OCR 데이터셋 hardcase_judge 정제 결과) 을 합친 것이다. 원본 1,571건 중 태그/
#   포맷 화이트리스트(허용 태그 34종/속성 14종) 위반 100건(raw MathML, img src 채움,
#   빈 <p></p>, <colgroup>/<tfoot>, base64 SVG 등) 을 제외한 1,471건만 반영했다.
#   2026-08-01, finetuning_dataset/combined_e25_28791/CHANGES.md 참고.
#
# - 새 1,471건의 image_path 는 /home/jhyeo/finetuning/imagedata/5400dataextract 로
#   재매핑했다(원래 ocr_filter_result/additional_dataset/5400dataextract 를 참조하던 것을,
#   jhyeo/finetuning 하위로 이미지 원본이 옮겨진 것에 맞춰 교체). image_dir 은 여전히
#   불필요(전부 절대경로).
#
# - 데이터 구성(train 23,950): combined_e24_refined 유래 22,727 + 신규(공공 OCR
#   hardcase, chandra_with_ocr) 1,223.
#
# - 예상 스텝: 23,950 / (1 x 8 x 3 GPU) = 998 step/epoch x 7 = 약 6,986 step.
#   e24 실측 속도(약 37~44s/step, 1024² 해상도, 3 GPU) 기준 약 3~3.5일. eval/save 가 50
#   step 마다 돌고 early stopping(patience 6)이 걸려 있으니 중간에 끊어도 체크포인트는
#   남는다.
#
# - 실행:
#   cd /home/jhyeo/finetuning/vlm
#   CUDA_VISIBLE_DEVICES=0,2,3 NUM_GPUS=3 MASTER_PORT=29670 WANDB_MODE=online \
#   WANDB_PROJECT="tsr_vlm_train" WANDB_ENTITY="aisearch260330-genon" \
#   CONFIG=config/e25_qwen35_9b_e20data_r64_px1m.yaml PHASE=sft \
#   bash distill/run_distill.sh 2>&1 | tee _run_logs/e25_$(date +%Y%m%d_%H%M%S).log
#   ※ 2026-08-01 기준 GPU0/2/3 이용률 100%, GPU1 은 죽은 프로세스가 77GB 를 물고 있어
#     실제 가용 여유가 없었다 — 실행 전 GPU 상태 재확인 필요.
# =============================================================================

student:
  name_or_path: "/home/jhyeo/ocr_file_filter/_models/Qwen3.5-9B"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

student_sft:
  output_dir: "./output/e25_qwen35_9b_e20data_r64_px1m/student_sft"
  # ===== e24 대비 유일한 변경: 데이터셋(공공 OCR hardcase 1,471건 추가) =====
  train_file: "../finetuning_dataset/combined_e25_28791/train.jsonl"
  eval_file: "../finetuning_dataset/combined_e25_28791/valid.jsonl"
  # image_path 가 절대경로라 image_dir 불필요(e22~e24 와 동일 사유).

  # ===== 아래는 e24 와 완전히 동일 =====
  num_train_epochs: 7
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.08
  max_seq_length: 8192
  truncate_to_assistant: false
  auto_expand_max_seq_length: true
  max_seq_length_cap: 12288
  long_table_context_margin_tokens: 512
  bf16: true
  tf32: false
  gradient_checkpointing: true
  auto_find_batch_size: false
  optim: "adamw_torch_fused"
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  max_eval_samples: 700

  task_mix_sampling: false
  span_weighted_sampling: false
  include_thinking: false
  annotate_empty_cells: true
  empty_cell_token: "__EMPTY__"
  single_quote_html_attrs: false
  strip_ocr_score: true

  train_ocr_mix_ratio: 0.5
  train_ocr_mix_seed: 20260320

  # 해상도: e22~e24 와 동일(1024²). dp500 실측에서 bbox 평행이동을 잡은 핵심 설정이라 유지한다.
  max_pixels: 1048576
  min_pixels: 65536

  # bbox 좌표 토큰 loss 가중치: e22~e24 와 동일하게 3.0 유지.
  token_weighting:
    enabled: true
    span_attribute_weight: 1.0
    bbox_weight: 3.0

  use_lora: true
  quantization:
    load_in_4bit: false
  lora_r: 64
  lora_alpha: 256       # scaling(alpha/r) = 4.0 — e22~e24 와 동일하게 유지
  lora_dropout: 0.15
  lora_bias: "none"
  lora_task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  report_to: "wandb"
  run_name: "e25_qwen35_9b_e20data_r64_px1m"
  logging_steps: 50
  save_steps: 50
  save_total_limit: null
  eval_steps: 50
  early_stopping:
    enabled: true
    patience: 6
    threshold: 0.0003
    metric: "eval_loss"
    greater_is_better: false
