# =============================================================================
# Knowledge Distillation Configuration
# Teacher (Large) → Student (Small) 모델 축소 설정
# =============================================================================

# --- Teacher Model ---
teacher:
  name_or_path: "Qwen/Qwen3-VL-235B-A22B-Instruct"          # canonical teacher id
  base_model: null                                           # LoRA adapter 경로 사용 시에만 필요
  torch_dtype: "bfloat16"
  device_map: "auto"
  revision: "main"
  force_download: false

# --- Student Model ---
student:
  name_or_path: "Qwen/Qwen3-VL-8B-Instruct"  # 9B급 student 대체
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

# --- Prompting ---
# style:
# - chandra_table_with_ocr
# - chandra_table_without_ocr
prompting:
  style: "chandra_table_with_ocr"
  bbox_scale: 1024

# --- Phase 1: Synthetic Data Generation ---
# Teacher로 대량의 고품질 학습 데이터를 생성
synthetic_generation:
  # 입력 이미지 소스
  image_sources:
    - "./data/extracted/aihub/Training/01.원천데이터"   # train과 공통 extraction 경로
  output_path: "./data/distill/synthetic_raw.jsonl"

  # 생성 설정
  num_generations_per_image: 3          # 이미지당 생성 횟수 (consistency check용)
  temperature: 0.3                       # 약간의 다양성
  max_new_tokens: 7000
  max_errors: 200                        # 연속 오류가 많으면 조기 중단
  batch_size: 1
  enable_thinking: true

  # 목표 수량
  target_samples: 30000                  # 최종 목표 합성 데이터 수

# --- Phase 2: Quality Filtering ---
quality_filter:
  input_path: "./data/distill/synthetic_raw.jsonl"
  output_path: "./data/distill/synthetic_filtered.jsonl"

  # 필터링 기준
  min_consistency_teds: 0.8              # 다수 생성 간 최소 TEDS
  min_table_rows: 2
  min_table_cols: 2
  max_table_rows: 50
  max_table_cols: 20
  require_thinking: false                # teacher 포맷 차이 대응
  require_valid_html: true
  require_closed_table: true
  max_html_length: 16000                 # 너무 긴 HTML 제외

  # Span 분포 밸런싱
  target_distribution:
    simple: 0.20                         # span 없음
    medium: 0.30                         # span 1~2개
    complex: 0.50                        # span 3+개

# --- Phase 3: Student SFT (Output Distillation) ---
student_sft:
  output_dir: "./output/student_sft"
  train_file: "./data/distill/train.jsonl"
  eval_file: "./data/distill/eval.jsonl"

  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5                  # Student는 LR 높게
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_seq_length: 8192
  auto_expand_max_seq_length: true
  max_seq_length_cap: 12288
  long_table_context_margin_tokens: 512
  bf16: true
  gradient_checkpointing: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true

  # LoRA (Student에도 QLoRA 사용 가능)
  use_lora: true
  lora_r: 128                            # Student는 rank 높게
  lora_alpha: 256
  lora_dropout: 0.05
  lora_bias: "none"
  lora_task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  strip_ocr_score: true
  # Optional train-time OCR mix:
  # train_ocr_mix_ratio: 0.5   # 50% OCR-on / 50% OCR-off
  # train_ocr_mix_seed: 20260320
  html_audit_sample_limit: 2000

  # Logging
  progress_by_epoch: false
  logging_strategy: "steps"
  save_strategy: "steps"
  eval_strategy: "steps"
  report_to: "none"
  run_name: "student_sft_distill"
  logging_steps: 10
  save_steps: 200
  save_total_limit: 3
  eval_steps: 200

# --- Phase 4: Logit Distillation (Optional, 고급) ---
logit_distillation:
  enabled: false
  output_dir: "./output/student_logit_distill"

  # 사전 계산된 Teacher logit 사용
  teacher_logits_dir: "./data/distill/teacher_logits/"
  # 또는 온라인 distillation (Teacher를 메모리에 유지)
  online_mode: false                     # true면 Teacher 실시간 추론
  student_init_path: "./output/student_sft/final"

  # Distillation 하이퍼파라미터
  temperature: 2.0                       # soft target temperature
  alpha: 0.5                             # distill_loss 가중치 (1-alpha = hard_loss)

  # 학습 설정
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  bf16: true

  # Logit 저장 설정 (offline mode)
  save_top_k_logits: 50                  # 전체 vocab 대신 top-k만 저장 (디스크 절약)

# --- Phase 5: Feature Distillation (Optional, 실험적) ---
feature_distillation:
  enabled: false
  output_dir: "./output/student_feature_distill"

  # 레이어 매핑 (Teacher layer → Student layer)
  # Qwen3-VL-235B: 94 layers, Qwen3-VL-8B: 32 layers
  layer_mapping:
    12: 4
    24: 8
    47: 16
    70: 24
    94: 32

  # 차원 변환 (Teacher hidden_dim → Student hidden_dim)
  teacher_hidden_dim: 8192               # 235B
  student_hidden_dim: 4096               # 8B
  projection_type: "linear"              # linear / mlp

  feature_loss_weight: 0.3
  logit_loss_weight: 0.5
  hard_loss_weight: 0.2
