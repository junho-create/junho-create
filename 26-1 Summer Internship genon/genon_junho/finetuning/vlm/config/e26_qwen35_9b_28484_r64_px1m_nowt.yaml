# =============================================================================
# E26 SFT — Qwen3.5-9B(Instruct) + combined_e26_28484, loss 가중치만 OFF
#
# - 베이스 config: e25_qwen35_9b_e20data_r64_px1m.yaml
# - e25 대비 바뀐 것 딱 2개:
#     (1) 데이터셋:        combined_e25_28791 -> combined_e26_28484
#     (2) token_weighting: enabled true(bbox_weight 3.0) -> **false**
#   나머지는 e25(=e22~e25 계열) 그대로:
#     LoRA r64 / alpha256(scaling 4.0) / dropout 0.15, LR 1.5e-5, 7 epoch,
#     max_pixels 1048576(1024²), seq 8192(cap 12288), ocr_mix 0.5
#
#   ※ 한 번 e19(r128, token_weighting 없음) 를 베이스로 잡았다가 되돌렸다.
#     사용자 지시: "나머지 가중치는 e25 꺼" — LoRA rank/alpha 는 e25 값(64/256)이 맞고,
#     e19 에서 바꾸는 게 아니라 **e25 에서 loss 가중치만 끄는** 형태다.
#
# - 데이터: combined_e26_28484 (train 23,695 / valid 2,743 / test 2,046 = 28,484)
#   combined_e25_28791(28,788) 에서 두 가지를 뺀 것 — finetuning_dataset/build_e26.py
#   하나로 처음부터 재현된다:
#     1) 렌더링하면 사각형이 아닌 표가 있는 페이지 268장 제외(Chromium 픽셀 검증 확정분)
#     2) 수식 있는 페이지 중 dots.ocr 이 Formula 를 빈 내용으로 뱉은 36장 제외
#   그리고 수식 있는 페이지 167장은 gt_html 전체를 dots.ocr 예측으로 교체했다
#   (reference_16886 출신 146장과 dots parse_note 있는 2장은 GT 보존).
#
# - 예상 스텝: 23,695 / (1 x 8 x 3 GPU) = 987 step/epoch x 7 = 약 6,916 step.
#   e25 실측(37~44s/step, 1024², 3 GPU) 기준 약 3~3.5일. eval/save 가 50 step 마다
#   돌고 early stopping(patience 6, threshold 3e-4)이 있어 중간에 끊어도 체크포인트는 남는다.
#
# - 실행:
#   cd /home/jhyeo/finetuning/vlm
#   CUDA_VISIBLE_DEVICES=0,2,3 NUM_GPUS=3 MASTER_PORT=29680 WANDB_MODE=online \
#   WANDB_PROJECT="tsr_vlm_train" WANDB_ENTITY="aisearch260330-genon" \
#   CONFIG=config/e26_qwen35_9b_28484_r64_px1m_nowt.yaml PHASE=sft \
#   bash distill/run_distill.sh 2>&1 | tee _run_logs/e26_$(date +%Y%m%d_%H%M%S).log
#   ※ GPU1 은 다른 네임스페이스가 77GB 를 물고 있어 사용 불가 — 실행 전 재확인.
# =============================================================================

student:
  name_or_path: "/home/jhyeo/ocr_file_filter/_models/Qwen3.5-9B"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

student_sft:
  output_dir: "./output/e26_qwen35_9b_28484_r64_px1m_nowt/student_sft"
  # ===== e25 대비 변경 (1/2): 데이터셋 =====
  train_file: "../finetuning_dataset/combined_e26_28484/train.jsonl"
  eval_file: "../finetuning_dataset/combined_e26_28484/valid.jsonl"
  # image_path 가 절대경로라 image_dir 불필요(e22~e25 와 동일 사유).

  # ===== 아래는 e25 와 완전히 동일 =====
  num_train_epochs: 7
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.08
  max_seq_length: 8192
  truncate_to_assistant: false
  auto_expand_max_seq_length: true
  max_seq_length_cap: 12288
  long_table_context_margin_tokens: 512
  bf16: true
  tf32: false
  gradient_checkpointing: true
  auto_find_batch_size: false
  optim: "adamw_torch_fused"
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  max_eval_samples: 700

  task_mix_sampling: false
  span_weighted_sampling: false
  include_thinking: false
  annotate_empty_cells: true
  empty_cell_token: "__EMPTY__"
  single_quote_html_attrs: false
  strip_ocr_score: true

  train_ocr_mix_ratio: 0.5
  train_ocr_mix_seed: 20260320

  # 해상도: e22~e25 와 동일(1024²). dp500 실측에서 bbox 평행이동을 잡은 핵심 설정이라 유지.
  max_pixels: 1048576
  min_pixels: 65536

  # ===== e25 대비 변경 (2/2): loss 가중치 OFF =====
  # student_sft.py:453 이 token_weighting.enabled 를 기본 False 로 읽으므로 블록을 통째로
  # 빼도 되지만, "의도적으로 껐다"는 걸 남기려고 명시적으로 false 로 둔다.
  # e22~e25 는 data-bbox 좌표 토큰에 3.0 가중치를 줬는데, e26 은 그 가중치 없이 학습한다.
  token_weighting:
    enabled: false
    span_attribute_weight: 1.0
    bbox_weight: 1.0

  use_lora: true
  quantization:
    load_in_4bit: false
  lora_r: 64
  lora_alpha: 256       # scaling(alpha/r) = 4.0 — e22~e25 와 동일하게 유지
  lora_dropout: 0.15
  lora_bias: "none"
  lora_task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  report_to: "wandb"
  run_name: "e26_qwen35_9b_28484_r64_px1m_nowt"
  logging_steps: 50
  save_steps: 50
  save_total_limit: null
  eval_steps: 50
  early_stopping:
    enabled: true
    patience: 6
    threshold: 0.0003
    metric: "eval_loss"
    greater_is_better: false
