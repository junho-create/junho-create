# =============================================================================
# Distillation Test Configuration (Smoke Test)
# Teacher: Qwen/Qwen3-VL-235B-A22B-Instruct-FP8
# Student: 9B급 대체로 Qwen3-VL-8B-Instruct 사용
# =============================================================================

teacher:
  name_or_path: "Qwen/Qwen3-VL-235B-A22B-Instruct-FP8"
  base_model: null
  # backend: "vllm" (FP8/대형 모델 권장) 또는 "transformers"
  backend: "vllm"
  fallback_to_transformers: false
  fallback_name_or_path: "Qwen/Qwen3-VL-235B-A22B-Instruct"

  # --- vLLM 옵션 (backend=vllm 일 때 사용) ---
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.85
  max_model_len: 10240
  max_pixels: 1048576   # 1024*1024
  min_pixels: 262144    # 512*512

  # --- transformers 옵션 (backend=transformers 일 때 사용) ---
  torch_dtype: "bfloat16"
  device_map: "auto"
  revision: "main"
  force_download: false
  quantization: null

student:
  name_or_path: "Qwen/Qwen3-VL-8B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

prompting:
  # chandra_table_with_ocr | chandra_table_without_ocr
  style: "chandra_table_with_ocr"
  bbox_scale: 1024

synthetic_generation:
  image_sources:
    - "./data/extracted/aihub/Training/01.원천데이터"
  output_path: "./data/distill/synthetic_raw.jsonl"

  num_generations_per_image: 1
  temperature: 0.0
  max_new_tokens: 3072
  max_oom_errors: 3
  max_errors: 30
  batch_size: 1
  enable_thinking: true
  target_samples: 64

quality_filter:
  input_path: "./data/distill/synthetic_raw.jsonl"
  output_path: "./data/distill/synthetic_filtered.jsonl"

  min_consistency_teds: 0.0
  min_table_rows: 2
  min_table_cols: 2
  max_table_rows: 80
  max_table_cols: 30
  require_thinking: false
  require_valid_html: true
  max_html_length: 20000

  target_distribution:
    simple: 0.40
    medium: 0.35
    complex: 0.25

student_sft:
  output_dir: "./output/student_sft_test"
  train_file: "./data/processed/aihub_training_sampled_ocr_3000.jsonl"
  eval_file: "./data/distill/eval.jsonl"

  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  max_seq_length: 4096
  bf16: true
  gradient_checkpointing: true
  dataloader_num_workers: 2
  dataloader_pin_memory: true

  # max_train_samples: 제거하여 전체 데이터(3000건) 사용
  # max_eval_samples: 8

  use_lora: true
  lora_r: 64
  lora_alpha: 128

  report_to: "none"
  run_name: "student_sft_test"
  logging_steps: 5
  save_steps: 50
  save_total_limit: 2
  eval_steps: 50

logit_distillation:
  enabled: false
  output_dir: "./output/student_logit_distill_test"

  teacher_logits_dir: "./data/distill/teacher_logits_test"
  online_mode: false
  student_init_path: "./output/student_sft_test/final"

  temperature: 2.0
  alpha: 0.5

  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  bf16: true
  save_top_k_logits: 50

feature_distillation:
  enabled: false
  output_dir: "./output/student_feature_distill_test"

  layer_mapping:
    12: 4
    24: 8
    47: 16
    70: 24
    94: 32

  teacher_hidden_dim: 8192
  student_hidden_dim: 4096
  projection_type: "linear"

  feature_loss_weight: 0.3
  logit_loss_weight: 0.5
  hard_loss_weight: 0.2
