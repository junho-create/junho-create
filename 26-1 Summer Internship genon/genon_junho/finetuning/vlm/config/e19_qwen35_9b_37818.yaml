# =============================================================================
# E19 Phase 1 SFT (Qwen3.5-9B, finetuning_dataset/combined 37818 train/valid/test, W&B online)
# - Base config: exp_e17_6910.yaml 네이밍/구조 참고, 데이터는 finetuning_dataset/combined
# - 데이터: reference_16886(사람 GT) + new_63541(Medium+Hard 20,932) 통합, ≈83:10:7
#   비율로 train/valid/test 합침 -- ../../finetuning_dataset/README.md 참고.
#   train 31,328 / valid 3,695 / test 2,795 (합계 37,818).
# - image_path 는 합칠 때 전부 절대경로로 고정해뒀음(image_dir 설정 불필요).
# =============================================================================

student:
  name_or_path: "/home/jhyeo/ocr_file_filter/_models/Qwen3.5-9B"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

student_sft:
  output_dir: "./output/e19_qwen35_9b_37818/student_sft"
  train_file: "../finetuning_dataset/combined/train.jsonl"
  eval_file: "../finetuning_dataset/combined/valid.jsonl"
  # image_path 가 합친 데이터셋 안에서 이미 절대경로라 image_dir 는 안 쓰임(설정 무의미,
  # train_qlora.py 의 _resolve_image_path 가 절대경로면 그대로 반환).

  # ===== batch/accum: 이 서버 GPU 개수 기준 OOM 방지 조정 (effective batch는 유지) =====
  # 2026-07-20: batch=2/accum=4 조합으로 CUDA OOM 발생 이력 있어 batch=1/accum=8로 조정.
  num_train_epochs: 7
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.08
  max_seq_length: 8192
  truncate_to_assistant: false
  auto_expand_max_seq_length: true
  max_seq_length_cap: 12288
  long_table_context_margin_tokens: 512
  bf16: true
  tf32: false
  gradient_checkpointing: true
  auto_find_batch_size: false
  optim: "adamw_torch_fused"
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  max_eval_samples: 700

  task_mix_sampling: false
  span_weighted_sampling: false
  include_thinking: false
  annotate_empty_cells: true
  empty_cell_token: "__EMPTY__"
  single_quote_html_attrs: false
  strip_ocr_score: true

  train_ocr_mix_ratio: 0.5
  train_ocr_mix_seed: 20260320

  max_pixels: 262144
  min_pixels: 65536

  use_lora: true
  quantization:
    load_in_4bit: false
  lora_r: 128
  lora_alpha: 256
  lora_dropout: 0.15
  lora_bias: "none"
  lora_task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  report_to: "wandb"
  run_name: "e19_qwen35_9b_37818"
  logging_steps: 50
  save_steps: 50
  save_total_limit: null
  eval_steps: 50
  early_stopping:
    enabled: true
    patience: 6
    threshold: 0.0003
    metric: "eval_loss"
    greater_is_better: false
