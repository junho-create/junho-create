# =============================================================================
# E6: Span 성능 최대화 - Phase 2 (Span 특화 Fine-tuning)
# - Phase 1 (e6_span) 체크포인트에서 이어서 학습
# - Span 가중 샘플링 활성화 (complex 80%)
# - 낮은 LR (Phase 1의 1/4)
# - OCR: ON (chandra_table_with_ocr)
# =============================================================================

teacher:
  name_or_path: "Qwen/Qwen3-VL-235B-A22B-Instruct-FP8"
  base_model: null
  backend: "vllm"
  fallback_to_transformers: false
  fallback_name_or_path: "Qwen/Qwen3-VL-235B-A22B-Instruct"

  # vLLM 옵션
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.85
  max_model_len: 10240
  max_pixels: 1048576   # 1024*1024
  min_pixels: 262144    # 512*512

student:
  name_or_path: "Qwen/Qwen3-VL-8B-Instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

prompting:
  style: "chandra_table_with_ocr"
  bbox_scale: 1024

student_sft:
  output_dir: "./output/e6_span_phase2/student_sft"
  resume_from_adapter: "./output/e6_span/student_sft/final"
  train_file: "./data/experiments/e6_span/train_augmented.jsonl"
  eval_file: "./data/experiments/shared/eval.jsonl"

  num_train_epochs: 5
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-6          # Phase 1의 1/4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  max_seq_length: 3072
  bf16: true
  tf32: true
  gradient_checkpointing: true
  auto_find_batch_size: false
  optim: "adamw_torch_fused"
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  max_eval_samples: 300

  # LoRA 설정 (resume_from_adapter 사용 시 새 LoRA 초기화 건너뜀)
  use_lora: true
  lora_r: 64
  lora_alpha: 128

  # Span 가중 샘플링
  span_weighted_sampling: true
  span_sampling_ratios:
    simple: 0.05
    medium: 0.15
    complex: 0.80

  report_to: "none"
  run_name: "e6_span_phase2"
  logging_steps: 50
  save_steps: 300
  save_total_limit: 3
  eval_steps: 300
  early_stopping:
    enabled: true
    patience: 3
    threshold: 0.001
    metric: "eval_loss"
    greater_is_better: false

logit_distillation:
  enabled: false

feature_distillation:
  enabled: false
