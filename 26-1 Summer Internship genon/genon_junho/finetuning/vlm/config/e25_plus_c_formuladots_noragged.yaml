# =============================================================================
# E25_PLUS Cell C (noragged + 수식 데이터 증강) — rank/alpha/LR 은 cell A_noragged
# 와 완전히 동일(16/64, 1.0e-5). 유일한 변수는 데이터: combined_e25plus_tsr6598_noragged
# (TSR 크롭 5,748/595/213) 위에 "수식이 있는 layout 페이지" 351장(train286/valid36/
# test29, finetuning_dataset/dotsocr_infer/e25_out_formula_only)을 얹었다. 단 그
# 페이지들의 Formula div 내용만 dots.ocr 예측 latex 로 교체했고(Table/Text/... 등
# 다른 div 는 GT 그대로), bbox IoU>=0.3 로 매칭된 것만 교체했다(train 79.3% 매칭,
# finetuning_dataset/build_c_formula_augmented.py 참고).
# 결과: train 6,034 / valid 631 (A/B 는 5,748/595).
#
# - 실행 (tmux, GPU3):
#   cd /home/jhyeo/finetuning/vlm
#   source .venv/bin/activate
#   CUDA_VISIBLE_DEVICES=3 NUM_GPUS=1 WANDB_MODE=online \
#   WANDB_PROJECT="tsr_vlm_train" WANDB_ENTITY="aisearch260330-genon" WANDB_RUN_GROUP="e25_plus_noragged" \
#   CONFIG=config/e25_plus_c_formuladots_noragged.yaml PHASE=sft \
#   bash distill/run_distill.sh 2>&1 | tee _run_logs/e25p_c_noragged_$(date +%Y%m%d_%H%M%S).log
# =============================================================================

student:
  name_or_path: "/home/jhyeo/ocr_file_filter/_models/Qwen3.5-9B-e25ck3900-merged"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

student_sft:
  output_dir: "./output/e25_plus_c_formuladots_noragged/student_sft"
  train_file: "../finetuning_dataset/combined_e25plus_tsr6598_noragged_plusformula/train.jsonl"
  eval_file: "../finetuning_dataset/combined_e25plus_tsr6598_noragged_plusformula/valid.jsonl"

  max_steps: 900
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5        # cell A_noragged 와 동일 — 데이터만 변인
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_seq_length: 12288
  truncate_to_assistant: false
  auto_expand_max_seq_length: true
  max_seq_length_cap: 16384
  long_table_context_margin_tokens: 512
  bf16: true
  tf32: false
  gradient_checkpointing: true
  auto_find_batch_size: false
  optim: "adamw_torch_fused"
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  max_eval_samples: 160

  task_mix_sampling: false
  span_weighted_sampling: false
  include_thinking: false
  annotate_empty_cells: true
  empty_cell_token: "__EMPTY__"
  single_quote_html_attrs: false
  strip_ocr_score: true

  train_ocr_mix_ratio: 0.5
  train_ocr_mix_seed: 20260320

  max_pixels: 1568000
  min_pixels: 65536

  token_weighting:
    enabled: true
    span_attribute_weight: 1.0
    bbox_weight: 3.0

  use_lora: true
  quantization:
    load_in_4bit: false
  lora_r: 16
  lora_alpha: 64        # scaling(alpha/r) = 4.0 — A/B 와 동일 유지
  lora_dropout: 0.05
  lora_bias: "none"
  lora_task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  report_to: "wandb"
  run_name: "e25_plus_c_formuladots_noragged"
  logging_steps: 25
  save_steps: 100
  save_total_limit: null
  eval_steps: 100
  early_stopping:
    enabled: true
    patience: 4
    threshold: 0.0
    metric: "eval_loss"
    greater_is_better: false
