# =============================================================================
# E20 본학습 (Qwen3.5-9B, finetuning_dataset/combined_e20 37818, W&B online)
# - e19 대비 변경점 2가지:
#   (1) 좌표계: 0~1000 정규화 -> 원본 이미지 픽셀 (combined_e20, 프롬프트에 WxH 명시)
#   (2) loss: data-bbox 좌표 토큰에 bbox_weight 가중치 (tsr_test per-token weighting 차용)
# - bbox_weight 값은 e20_sweep_w{2,3,5}(200 step) 의 dp500/valid bbox IoU 비교로 선정.
#   ↓ token_weighting.bbox_weight 를 선정값으로 설정할 것. (placeholder=3.0)
# - 그 외 하이퍼파라미터는 e19 와 동일(변인 최소화).
# =============================================================================

student:
  name_or_path: "/home/jhyeo/ocr_file_filter/_models/Qwen3.5-9B"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"

student_sft:
  output_dir: "./output/e20_qwen35_9b_pixel_bboxw/student_sft"
  train_file: "../finetuning_dataset/combined_e20/train.jsonl"
  eval_file: "../finetuning_dataset/combined_e20/valid.jsonl"

  num_train_epochs: 7
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.08
  max_seq_length: 8192
  truncate_to_assistant: false
  auto_expand_max_seq_length: true
  max_seq_length_cap: 12288
  long_table_context_margin_tokens: 512
  bf16: true
  tf32: false
  gradient_checkpointing: true
  auto_find_batch_size: false
  optim: "adamw_torch_fused"
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  max_eval_samples: 700

  task_mix_sampling: false
  span_weighted_sampling: false
  include_thinking: false
  annotate_empty_cells: true
  empty_cell_token: "__EMPTY__"
  single_quote_html_attrs: false
  strip_ocr_score: true

  train_ocr_mix_ratio: 0.5
  train_ocr_mix_seed: 20260320

  max_pixels: 262144
  min_pixels: 65536

  # ===== e20 신규: bbox 좌표 토큰 loss 가중치 (스윕에서 선정한 값으로 설정) =====
  token_weighting:
    enabled: true
    span_attribute_weight: 1.0
    bbox_weight: 5.0   # 스윕(200 step) bbox CE 최저: 1.0=0.9947 / 2.0=0.9720 / 3.0=0.9651 / 5.0=0.9532

  use_lora: true
  quantization:
    load_in_4bit: false
  lora_r: 128
  lora_alpha: 256
  lora_dropout: 0.15
  lora_bias: "none"
  lora_task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  report_to: "wandb"
  run_name: "e20_qwen35_9b_pixel_bboxw"
  logging_steps: 50
  save_steps: 50
  save_total_limit: null
  eval_steps: 50
  early_stopping:
    enabled: true
    patience: 6
    threshold: 0.0003
    metric: "eval_loss"
    greater_is_better: false
