# =============================================================================
# E7 Phase 1 SFT (Qwen3.5-9B, 20260225_1_3000 split)
# =============================================================================

student:
  name_or_path: "/home/vlm_train/models/Qwen3.5-9B"
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

student_sft:
  output_dir: "./output/e7_phase1_qwen35_9b_3000/student_sft"
  train_file: "./_train_data/20260225_1_3000/data_split/train.jsonl"
  eval_file: "./_train_data/20260225_1_3000/data_split/valid.jsonl"
  image_dir: "./_train_data/20260225_1_3000/images"

  num_train_epochs: 5
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_seq_length: 8192
  truncate_to_assistant: false
  auto_expand_max_seq_length: true
  max_seq_length_cap: 12288
  long_table_context_margin_tokens: 512
  bf16: true
  tf32: true
  gradient_checkpointing: true
  auto_find_batch_size: false
  optim: "adamw_torch_fused"
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  max_eval_samples: 300
  strip_ocr_score: true

  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_bias: "none"
  lora_task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

  report_to: "wandb"
  run_name: "e7_phase1_qwen35_9b_3000"
  logging_steps: 50
  save_steps: 100
  save_total_limit: null
  eval_steps: 200
  early_stopping:
    enabled: true
    patience: 3
    threshold: 0.001
    metric: "eval_loss"
    greater_is_better: false
